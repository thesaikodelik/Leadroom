name: Installer clean-machine test

# Builds Leadroom-Setup.exe and installs it on fresh Windows runners that do not
# have Ollama, once with Windows Package Manager and once with it hidden so the
# direct-download fallback is exercised. Each run also checks that:
# - an earlier Leadroom registered under another AppId is removed by the new Setup;
# - the installed app finds a newer signed release, downloads and checks it, runs
#   Setup quietly, and opens again as the new version (the in-app updater).
# Both builds are signed with a throwaway key made for the run; the release key
# never leaves the maintainer's computer.

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  NEXT_VERSION: "0.1.99"

jobs:
  build:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install --upgrade pip
          .\.venv\Scripts\python.exe -m pip install -r requirements-dev.txt
          npm ci --prefix frontend --no-audit --no-fund

      - name: Ensure Inno Setup
        shell: pwsh
        run: |
          $iscc = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:LOCALAPPDATA\Programs\Inno Setup 6\ISCC.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { choco install innosetup -y --no-progress }

      - name: Make a throwaway update signing key
        shell: pwsh
        run: .\.venv\Scripts\python.exe scripts\sign_update.py --key-file "$env:RUNNER_TEMP\test-update.key" keygen

      - name: Build the newer release the installed app will find
        shell: pwsh
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts\build-release.ps1 -Version $env:NEXT_VERSION -UpdateKeyFile "$env:RUNNER_TEMP\test-update.key"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force next | Out-Null
          Copy-Item dist\Leadroom-Setup.exe, dist\Leadroom-Setup.exe.sig next\

      - name: Build installer
        shell: pwsh
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts\build-release.ps1 -UpdateKeyFile "$env:RUNNER_TEMP\test-update.key"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build a stand-in for an earlier Leadroom under another AppId
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force earlier | Out-Null
          Set-Content earlier\earlier-version.txt "left by the earlier install"
          @'
          [Setup]
          AppId={{6E0B7C2A-0000-4000-8000-00000000E001}
          AppName=Leadroom
          AppVersion=0.0.9
          DefaultDirName={localappdata}\Programs\Leadroom
          PrivilegesRequired=lowest
          OutputDir=.
          OutputBaseFilename=Leadroom-Earlier-Setup
          DisableDirPage=no
          [Files]
          Source: "earlier-version.txt"; DestDir: "{app}"
          '@ -replace '(?m)^\s+', '' | Set-Content earlier\earlier.iss
          $iscc = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:LOCALAPPDATA\Programs\Inno Setup 6\ISCC.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          & $iscc /Q earlier\earlier.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v4
        with:
          name: leadroom-setup
          path: |
            dist/Leadroom-Setup.exe
            earlier/Leadroom-Earlier-Setup.exe
          retention-days: 3

      - uses: actions/upload-artifact@v4
        with:
          name: leadroom-next
          path: next/
          retention-days: 3

  clean-install:
    needs: build
    runs-on: windows-2025
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: with-winget
            disable_winget: "0"
          - name: without-winget
            disable_winget: "1"
    name: clean-install (${{ matrix.name }})
    timeout-minutes: 60
    env:
      LEADROOM_SETUP_DISABLE_WINGET: ${{ matrix.disable_winget }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: leadroom-setup

      - uses: actions/download-artifact@v4
        with:
          name: leadroom-next
          path: next

      - name: Confirm the runner has no Ollama
        shell: pwsh
        run: |
          $found = @(
            (Get-Command ollama.exe -ErrorAction SilentlyContinue).Source,
            "$env:LOCALAPPDATA\Programs\Ollama\ollama.exe",
            "$env:ProgramFiles\Ollama\ollama.exe"
          ) | Where-Object { $_ -and (Test-Path $_) }
          if ($found) { throw "Runner is not clean: Ollama found at $found" }
          "winget on runner: " + ((Get-Command winget.exe -ErrorAction SilentlyContinue).Source ?? "none")
          "winget hidden for this run: $env:LEADROOM_SETUP_DISABLE_WINGET"

      - name: Install the stand-in earlier version
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP "leadroom"
          $earlier = Start-Process -FilePath .\earlier\Leadroom-Earlier-Setup.exe -ArgumentList @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/DIR=$root\app") -PassThru -Wait
          if ($earlier.ExitCode -ne 0) { throw "The stand-in earlier version did not install." }
          $key = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\{6E0B7C2A-0000-4000-8000-00000000E001}_is1"
          if (-not (Test-Path $key)) { throw "The stand-in earlier version is not registered." }
          "Earlier version registered: $((Get-ItemProperty $key).DisplayName)"

      - name: Run Setup with every default component
        shell: pwsh
        timeout-minutes: 30
        run: |
          $root = Join-Path $env:RUNNER_TEMP "leadroom"
          $arguments = @(
            "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART",
            "/DIR=$root\app", "/DATAROOT=$root\data", "/DOWNLOADSROOT=$root\downloads",
            "/INSTALL_WEBVIEW=1", "/INSTALL_OLLAMA=1", "/DOWNLOAD_MODEL=1",
            "/LOG=$root-setup.log"
          )
          $setup = Start-Process -FilePath .\dist\Leadroom-Setup.exe -ArgumentList $arguments -PassThru
          $log = "$env:LOCALAPPDATA\Leadroom\logs\install.log"
          $deadline = (Get-Date).AddMinutes(25)
          $shown = 0
          while (-not $setup.WaitForExit(30000)) {
            "--- $(Get-Date -Format HH:mm:ss) still running"
            if (Test-Path $log) {
              $lines = @(Get-Content $log)
              $lines | Select-Object -Skip $shown
              $shown = $lines.Count
            }
            Get-ChildItem "$env:TEMP\is-*\leadroom-bootstrap.status" -ErrorAction SilentlyContinue |
              ForEach-Object { "status: " + ((Get-Content $_.FullName) -join ' | ') }
            Get-CimInstance Win32_Process |
              Where-Object { $_.Name -match 'powershell|ollama|winget|setup|webview|msiexec|AppInstaller' } |
              ForEach-Object { "proc: $($_.ProcessId) <- $($_.ParentProcessId) $($_.Name) $($_.CommandLine)".Substring(0, [Math]::Min(260, "proc: $($_.ProcessId) <- $($_.ParentProcessId) $($_.Name) $($_.CommandLine)".Length)) }
            if ((Get-Date) -gt $deadline) {
              Stop-Process -Id $setup.Id -Force
              throw "Setup did not finish within 25 minutes."
            }
          }
          if (Test-Path $log) { Get-Content $log | Select-Object -Skip $shown }
          "Setup exit code: $($setup.ExitCode)"
          if ($setup.ExitCode -ne 0) { throw "Setup failed with exit code $($setup.ExitCode)." }

      - name: Verify the earlier version was replaced
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP "leadroom"
          $key = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\{6E0B7C2A-0000-4000-8000-00000000E001}_is1"
          if (Test-Path $key) { throw "The earlier version is still registered after Setup." }
          if (Test-Path "$root\app\earlier-version.txt") { throw "The earlier version's files are still installed." }
          $entries = @(Get-ChildItem HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall |
            ForEach-Object { Get-ItemProperty $_.PSPath } | Where-Object { $_.DisplayName -like "Leadroom*" })
          "Leadroom entries in Apps: $($entries.DisplayName -join '; ')"
          if ($entries.Count -ne 1) { throw "Expected one Leadroom entry in Apps, found $($entries.Count)." }
          Select-String -Path "$root-setup.log" -Pattern "earlier Leadroom" | ForEach-Object { $_.Line }

      - name: Verify Leadroom, Ollama, and the model
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP "leadroom"
          if (-not (Test-Path "$root\app\Leadroom.exe")) { throw "Leadroom.exe was not installed." }
          $ollama = "$env:LOCALAPPDATA\Programs\Ollama\ollama.exe"
          if (-not (Test-Path $ollama)) { throw "Ollama was not installed." }
          $models = "$root\downloads\ollama\models"
          if ([Environment]::GetEnvironmentVariable("OLLAMA_MODELS", "User") -ne $models) {
            throw "OLLAMA_MODELS was not pointed at the selected downloads folder."
          }
          $manifest = "$models\manifests\registry.ollama.ai\library\llama3.2\3b"
          if (-not (Test-Path $manifest)) { throw "The llama3.2:3b model was not downloaded to $models." }
          $deadline = (Get-Date).AddSeconds(60)
          $names = @()
          while ((Get-Date) -lt $deadline) {
            try { $names = (Invoke-RestMethod http://127.0.0.1:11434/api/tags -TimeoutSec 3).models.name; break }
            catch { Start-Sleep -Seconds 2 }
          }
          "Ollama service models: $($names -join ', ')"
          $tray = Get-CimInstance Win32_Process -Filter "Name='ollama app.exe'" | Select-Object -First 1
          if ($tray) {
            $parent = (Get-CimInstance Win32_Process -Filter "ProcessId=$($tray.ParentProcessId)").Name
            "Ollama background app parent: $parent"
            if ($parent -match 'powershell|Leadroom-Setup') { throw "Ollama was started inside Setup's process tree." }
          }
          if ($names -notcontains "llama3.2:3b") { throw "The running Ollama service does not see llama3.2:3b." }

      - name: Start the installed app and check health
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP "leadroom"
          $env:LEAD_SCRAPER_NO_BROWSER = "1"
          $env:LEADROOM_PORT = "8877"
          $app = Start-Process -FilePath "$root\app\Leadroom.exe" -WindowStyle Hidden -PassThru
          $timer = [Diagnostics.Stopwatch]::StartNew()
          $health = $null
          while ($timer.Elapsed.TotalSeconds -lt 180 -and -not $app.HasExited) {
            try { $health = Invoke-RestMethod http://127.0.0.1:8877/api/v1/health -TimeoutSec 3; break }
            catch { Start-Sleep -Seconds 1 }
          }
          "Waited $([int]$timer.Elapsed.TotalSeconds)s; app exited: $($app.HasExited)"
          if ($app.HasExited) { "App exit code: $($app.ExitCode)" }
          Get-Content "$env:LOCALAPPDATA\Leadroom\logs\leadroom.log" -Tail 40 -ErrorAction SilentlyContinue
          if (-not $health -or $health.status -ne "ok") { throw "Installed application health check failed." }
          "Health: $($health | ConvertTo-Json -Compress)"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Update the running app from a test release feed
        shell: pwsh
        timeout-minutes: 20
        run: |
          $home_ = "$env:LOCALAPPDATA\Leadroom"
          $current = (Invoke-RestMethod http://127.0.0.1:8877/api/v1/health -TimeoutSec 30).version
          "Installed version: $current; offering $env:NEXT_VERSION"
          # A release list in the GitHub API's shape, served next to the newer signed Setup.
          $release = @{
            tag_name = "v$env:NEXT_VERSION"; html_url = "http://127.0.0.1:8899/"; draft = $false; prerelease = $false; body = "Test release"
            assets = @(
              @{ name = "Leadroom-Setup.exe"; browser_download_url = "http://127.0.0.1:8899/Leadroom-Setup.exe"; size = (Get-Item next\Leadroom-Setup.exe).Length },
              @{ name = "Leadroom-Setup.exe.sig"; browser_download_url = "http://127.0.0.1:8899/Leadroom-Setup.exe.sig"; size = 0 }
            )
          }
          ConvertTo-Json @($release) -Depth 5 | Set-Content next\releases.json -Encoding utf8
          $server = Start-Process python -ArgumentList @("-m", "http.server", "8899", "--bind", "127.0.0.1", "--directory", (Resolve-Path next).Path) -PassThru -WindowStyle Hidden
          # The app is asked to check at once, so wait until the feed answers; a slow
          # runner can take several seconds to start Python.
          $feedReady = $false
          for ($i = 0; $i -lt 60 -and -not $feedReady; $i++) {
            try { Invoke-RestMethod http://127.0.0.1:8899/releases.json -TimeoutSec 2 | Out-Null; $feedReady = $true } catch { Start-Sleep -Milliseconds 500 }
          }
          if (-not $feedReady) { throw "The test release feed did not start." }
          Set-Content "$home_\update-feed.txt" "http://127.0.0.1:8899/releases.json"
          $token = (Get-Content "$home_\leadroom.instance.json" | ConvertFrom-Json).token
          # A cookie in a web session: a Cookie entry in -Headers is not sent by every PowerShell.
          $session = New-Object Microsoft.PowerShell.Commands.WebRequestSession
          $session.Cookies.Add((New-Object System.Net.Cookie("leadroom_session", $token, "/", "127.0.0.1")))
          $api = "http://127.0.0.1:8877/api/v1"

          $found = Invoke-RestMethod -Method Post "$api/updates/check" -WebSession $session -TimeoutSec 60
          "Check: $($found | ConvertTo-Json -Compress)"
          if ($found.phase -ne "available" -or $found.version -ne $env:NEXT_VERSION) { throw "The app did not find the newer release." }
          if (-not $found.installed) { throw "The app does not know it was installed by Setup." }

          Invoke-RestMethod -Method Post "$api/updates/download" -WebSession $session -TimeoutSec 60 | Out-Null
          $deadline = (Get-Date).AddMinutes(5)
          do {
            Start-Sleep -Seconds 2
            $state = Invoke-RestMethod "$api/updates" -WebSession $session -TimeoutSec 60
          } while ($state.phase -eq "downloading" -and (Get-Date) -lt $deadline)
          "Download: $($state | ConvertTo-Json -Compress)"
          if ($state.phase -ne "ready") { throw "The update was not downloaded and verified: $($state.error)" }

          $old = @(Get-Process Leadroom -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Id)
          "Leadroom processes before the update: $($old -join ', ')"
          Invoke-RestMethod -Method Post "$api/updates/install" -WebSession $session -TimeoutSec 60 | Out-Null
          $deadline = (Get-Date).AddMinutes(10)
          $health = $null
          while ((Get-Date) -lt $deadline) {
            Start-Sleep -Seconds 3
            try {
              $health = Invoke-RestMethod http://127.0.0.1:8877/api/v1/health -TimeoutSec 3
              if ($health.version -eq $env:NEXT_VERSION) { break }
            } catch {}
          }
          Stop-Process -Id $server.Id -Force -ErrorAction SilentlyContinue
          "--- update.log"; Get-Content "$home_\logs\update.log" -ErrorAction SilentlyContinue
          "--- update-installer.log (tail)"; Get-Content "$home_\logs\update-installer.log" -Tail 30 -ErrorAction SilentlyContinue
          if (-not $health -or $health.version -ne $env:NEXT_VERSION) { throw "The app did not come back as $env:NEXT_VERSION after the update." }
          "Running after the update: $($health | ConvertTo-Json -Compress)"
          $still = if ($old.Count) { Get-Process -Id $old -ErrorAction SilentlyContinue }
          if ($still) { throw "The old app process is still running." }
          $entry = Get-ChildItem HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall |
            ForEach-Object { Get-ItemProperty $_.PSPath } | Where-Object { $_.DisplayName -like "Leadroom*" }
          "Apps entry: $($entry.DisplayName) $($entry.DisplayVersion)"
          if (@($entry).Count -ne 1 -or $entry.DisplayVersion -ne $env:NEXT_VERSION) { throw "Apps does not list exactly one Leadroom $env:NEXT_VERSION." }
          Start-Sleep -Seconds 3
          if (Test-Path "$home_\update-pending.json") { throw "The new version did not clear the pending-update note." }
          Select-String -Path "$home_\logs\update.log" -Pattern "arrived" | ForEach-Object { $_.Line }

      - name: Collect logs
        if: always()
        shell: pwsh
        timeout-minutes: 5
        run: |
          "--- update.log"; Get-Content "$env:LOCALAPPDATA\Leadroom\logs\update.log" -ErrorAction SilentlyContinue
          "--- update-installer.log (tail)"; Get-Content "$env:LOCALAPPDATA\Leadroom\logs\update-installer.log" -Tail 60 -ErrorAction SilentlyContinue
          "--- leadroom.log (tail)"; Get-Content "$env:LOCALAPPDATA\Leadroom\logs\leadroom.log" -Tail 40 -ErrorAction SilentlyContinue
          "--- processes"; Get-CimInstance Win32_Process | Where-Object { $_.Name -match 'Leadroom|python|powershell|is-|setup' } | ForEach-Object { "$($_.ProcessId) <- $($_.ParentProcessId) $($_.Name)" }
          New-Item -ItemType Directory -Force logs | Out-Null
          Copy-Item "$env:LOCALAPPDATA\Leadroom\logs\*" logs\ -ErrorAction SilentlyContinue
          Copy-Item "$env:RUNNER_TEMP\leadroom-setup.log" logs\ -ErrorAction SilentlyContinue
          Get-Content logs\install.log -ErrorAction SilentlyContinue

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logs-${{ matrix.name }}
          path: logs/
          retention-days: 7
